<!DOCTYPE html>
<html lang="pt-br">
<head>

</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

      <a class="navbar-brand" href="dashboard-estab.html">Slotify</a>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Serviços Oferecidos</h2>

          <th>Serviço</th>
          <th>Duração</th>

        </tr>

            <button class="btn btn-sm btn-warning">Editar</button>

        </tr>
        <tr>
          <td>Barba</td>
          <td>20 min</td>
          <td>R$ 25,00</td>
          <td>
            <button class="btn btn-sm btn-warning">Editar</button>

          </td>
        </tr>
        <!-- Outros serviços -->
      </tbody>
    </table>
    <a href="#" class="btn btn-primary mt-3">Adicionar Serviço</a>
