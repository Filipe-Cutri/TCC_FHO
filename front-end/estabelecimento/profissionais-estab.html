<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profissionais - Slotfy - Slotfy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
  <style>
    /* Additional styles for fixed navbar */
    body {
      padding-top: 80px;
    }
    
    .navbar {
      transition: all 0.3s ease;
    }
    
    .main-content {
      min-height: calc(100vh - 80px);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard-estab.html">
        <img src="../assets/logo-slotfy.png" alt="Slotfy Logo">
        Slotfy
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a href="dashboard-estab.html" class="btn btn-outline-light me-2">Dashboard</a>
          <a href="login-estab.html" class="btn btn-outline-light">Sair</a>
        </div>
      </div>
    </div>
  </nav>
  <div class="main-content">
    <div class="container mt-4">
    <h2>Profissionais</h2>
    <table class="table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Especialidade</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>João</td>
          <td>Corte Masculino</td>
          <td><span class="badge bg-success">Ativo</span></td>
          <td>
            <button class="btn btn-sm btn-warning">Editar</button>
            <button class="btn btn-sm btn-danger">Remover</button>
          </td>
        </tr>
        <tr>
          <td>Lucas</td>
          <td>Barba</td>
          <td><span class="badge bg-success">Ativo</span></td>
          <td>
            <button class="btn btn-sm btn-warning">Editar</button>
            <button class="btn btn-sm btn-danger">Remover</button>
          </td>
        </tr>
        <!-- Mais profissionais -->
      </tbody>
    </table>
    <a href="#" class="btn btn-primary mt-3">Adicionar Profissional</a>
  </div>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Navbar scroll effects
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
        navbar.style.backdropFilter = 'blur(20px)';
      } else {
        navbar.style.backgroundColor = 'var(--color-neutral-0)';
        navbar.style.backdropFilter = 'blur(20px)';
      }
    });
    
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>
</body>
</html>
