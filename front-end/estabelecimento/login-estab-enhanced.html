<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Basic Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  
  <!-- SEO Meta Tags -->
  <title>Login do Estabelecimento - Slotfy</title>
  <meta name="description" content="Acesse o painel do seu estabelecimento no Slotfy para gerenciar agendamentos, serviços e clientes de forma inteligente.">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Login do Estabelecimento - Slotfy">
  <meta property="og:description" content="Sistema completo de gestão para barbeiros, cabeleireiros e salões">
  <meta property="og:site_name" content="Slotfy">
  
  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Slotfy">
  <meta name="theme-color" content="#0ea5e9">
  
  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="../assets/favicon-slotfy.png">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <!-- Stylesheets -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../src/assets/styles/common.css">
  <link rel="stylesheet" href="../src/assets/styles/welcome.css">
  <link rel="stylesheet" href="../src/assets/styles/logo-system.css">
  <style>
    /* Auth Page Specific Styles for Establishment */
    body {
      padding-top: 0;
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>'),
        linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.05) 50%, transparent 70%);
      animation: heroFloat 20s ease-in-out infinite;
      pointer-events: none;
    }
    
    @keyframes heroFloat {
      0%, 100% { transform: translateX(-10px) translateY(-5px); }
      50% { transform: translateX(10px) translateY(5px); }
    }
    
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      margin: 2rem auto;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    
    .auth-logo-container {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      padding: 1.5rem;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.3);
    }
    
    .auth-logo {
      filter: brightness(0) invert(1);
      max-height: 40px;
    }
    
    .auth-title {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 2rem;
      font-weight: var(--font-weight-bold);
      margin-bottom: 0.5rem;
    }
    
    .auth-subtitle {
      color: var(--color-neutral-600);
      font-size: 1.125rem;
      margin-bottom: 0;
    }
    
    .form-floating {
      margin-bottom: 1.5rem;
    }
    
    .form-floating .form-control {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 1.25rem 1rem;
      background: linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);
      transition: all 0.3s ease;
      font-size: 1rem;
    }
    
    .form-floating .form-control:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
      background: #ffffff;
    }
    
    .form-floating label {
      color: #6b7280;
      font-weight: 500;
      padding: 1.25rem 1rem;
    }
    
    .btn-auth-establishment {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }
    
    .btn-auth-establishment:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
      color: white;
    }
    
    .auth-links {
      margin-top: 2rem;
      text-align: center;
    }
    
    .auth-links a {
      color: #0ea5e9;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      display: block;
      margin-bottom: 1rem;
      padding: 0.5rem;
      border-radius: 8px;
    }
    
    .auth-links a:hover {
      color: #0369a1;
      background: rgba(14, 165, 233, 0.1);
    }
    
    .back-link {
      color: #6b7280 !important;
      font-size: 0.875rem;
    }
    
    .back-link:hover {
      color: #374151 !important;
      background: rgba(107, 114, 128, 0.1) !important;
    }
    
    .auth-features {
      margin-top: 2.5rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }
    
    .auth-features-title {
      color: #374151;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    
    .feature-item {
      text-align: center;
    }
    
    .feature-item i {
      color: #10b981;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    .feature-item span {
      font-size: 0.75rem;
      color: #6b7280;
      display: block;
    }
    
    /* Mobile optimizations */
    @media (max-width: 768px) {
      .auth-card {
        padding: 2rem 1.5rem;
        margin: 1rem;
        border-radius: 20px;
      }
      
      .auth-title {
        font-size: 1.75rem;
      }
      
      .features-grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
              <div class="auth-logo-container">
                <img src="../src/assets/logo-slotfy.png" alt="Slotfy Logo" class="auth-logo">
              </div>
              <h1 class="auth-title">Área do Estabelecimento</h1>
              <p class="auth-subtitle">Gerencie seus agendamentos e serviços de forma inteligente</p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm">
              <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                <label for="email">🏪 E-mail do Estabelecimento</label>
              </div>
              
              <div class="form-floating">
                <input type="password" class="form-control" id="senha" placeholder="Sua senha" required>
                <label for="senha">🔐 Senha</label>
              </div>
              
              <button type="submit" class="btn btn-auth-establishment">
                <i class="fas fa-store me-2"></i>
                Acessar Dashboard
              </button>
            </form>
            
            <!-- Auth Links -->
            <div class="auth-links">
              <a href="forgot-password-estab.html">
                Esqueceu a senha? Clique aqui
              </a>
              <a href="register-estab.html">
                Não tem cadastro? Cadastre seu estabelecimento
              </a>
              <a href="../src/index.html" class="back-link">
                ← Voltar ao início
              </a>
            </div>
          </div>
          
          <!-- Additional Features Info -->
          <div class="auth-features">
            <p class="auth-features-title">
              <i class="fas fa-chart-line me-2" style="color: #10b981;"></i>
              Gerencie seu negócio com ferramentas profissionais
            </p>
            <div class="features-grid">
              <div class="feature-item">
                <i class="fas fa-chart-line"></i>
                <span>Relatórios<br>Detalhados</span>
              </div>
              <div class="feature-item">
                <i class="fas fa-users"></i>
                <span>Gestão de<br>Clientes</span>
              </div>
              <div class="feature-item">
                <i class="fas fa-calendar"></i>
                <span>Agenda<br>Inteligente</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Enhanced form handling
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      
      // Validate fields
      if (!email || !senha) {
        alert('Por favor, preencha todos os campos obrigatórios.');
        return;
      }
      
      // Add loading state
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Acessando...';
      submitBtn.disabled = true;
      
      // Simulate login process (replace with actual API call)
      setTimeout(() => {
        // For demo purposes, simulate success
        alert('Login realizado com sucesso! Redirecionando para o dashboard...');
        
        // In a real application, you would:
        // 1. Make API call to authenticate
        // 2. Store user session/token
        // 3. Redirect to establishment dashboard
        window.location.href = 'dashboard-estab.html';
      }, 2000);
    });
    
    // Add smooth animations
    document.addEventListener('DOMContentLoaded', function() {
      // Animate card entrance
      const authCard = document.querySelector('.auth-card');
      authCard.style.opacity = '0';
      authCard.style.transform = 'translateY(30px)';
      authCard.style.transition = 'all 0.6s ease';
      
      setTimeout(() => {
        authCard.style.opacity = '1';
        authCard.style.transform = 'translateY(0)';
      }, 100);
      
      // Animate features
      const features = document.querySelector('.auth-features');
      features.style.opacity = '0';
      features.style.transform = 'translateY(20px)';
      features.style.transition = 'all 0.6s ease 0.3s';
      
      setTimeout(() => {
        features.style.opacity = '1';
        features.style.transform = 'translateY(0)';
      }, 500);
    });
  </script>
</body>
</html>
