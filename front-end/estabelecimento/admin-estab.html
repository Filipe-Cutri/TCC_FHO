<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Administração - Slotify</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard-estab.html">Slotify</a>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Administração</h2>
    <div class="row mt-3">
      <div class="col-md-6">
        <h4>Profissionais</h4>
        <a href="profissionais-estab.html" class="btn btn-outline-primary mb-3">Gerenciar Profissionais</a>
        <h4>Serviços</h4>
        <a href="servicos-estab.html" class="btn btn-outline-primary mb-3">Gerenciar Serviços</a>
      </div>
      <div class="col-md-6">
        <h4>Horários de Funcionamento</h4>
        <form>
          <div class="mb-3">
            <label class="form-label">Dias de funcionamento</label>
            <input type="text" class="form-control" value="Seg a Sáb">
          </div>
          <div class="mb-3">
            <label class="form-label">Horário de abertura</label>
            <input type="time" class="form-control" value="09:00">
          </div>
          <div class="mb-3">
            <label class="form-label">Horário de fechamento</label>
            <input type="time" class="form-control" value="19:00">
          </div>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
