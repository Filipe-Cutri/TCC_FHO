<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Slotify</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body class="bg-light">
  <div class="main-content">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="text-center mb-4">
            <img src="../assets/logo-slotify.png" alt="Slotify Logo" class="login-logo mb-3">
            <h2>Login do Cliente</h2>
          </div>
        <form>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
          <div class="mt-3 text-center">
            <a href="register.html">Não tem cadastro? Crie aqui</a>
          </div>
          <div class="mt-2 text-center">
            <a href="../index.html" class="text-muted">← Voltar ao início</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  </div>
  
  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h5>Slotify</h5>
          <p>Seu sistema de agendamento inteligente para barbearias e salões.</p>
        </div>
        <div class="col-md-6">
          <h5>Links Rápidos</h5>
          <ul class="list-unstyled">
            <li><a href="../index.html">Página Inicial</a></li>
            <li><a href="login.html">Login Cliente</a></li>
            <li><a href="../estabelecimento/login-estab.html">Login Estabelecimento</a></li>
            <li><a href="register.html">Cadastro Cliente</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 Slotify. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Exemplo simples de submit
    $('form').on('submit', function(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
