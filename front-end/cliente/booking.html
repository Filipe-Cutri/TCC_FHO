<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Horário - Slotify</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">
        <img src="../assets/logo-slotify.png" alt="Slotify Logo">
        Slotify
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a href="dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
          <a href="login.html" class="btn btn-outline-light">Sair</a>
        </div>
      </div>
    </div>
  </nav>
  <div class="main-content">
    <div class="container mt-4">
    <h2>Novo Agendamento</h2>
    <form id="formAgendamento" class="mt-3">
      <div class="mb-3">
        <label class="form-label">Serviço</label>
        <select class="form-select" required>
          <option value="">Selecione</option>
          <option value="corte">Corte Masculino</option>
          <option value="barba">Barba</option>
          <option value="combo">Combo Corte + Barba</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Profissional</label>
        <select class="form-select" required>
          <option value="">Selecione</option>
          <option value="joao">João</option>
          <option value="lucas">Lucas</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Data</label>
        <input type="date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Horário sugerido pela IA</label>
        <select class="form-select" required>
          <option>14:00</option>
          <option>15:00</option>
          <option>16:00</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success">Confirmar Agendamento</button>
    </form>
  </div>
  </div>
  
  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h5>Slotify</h5>
          <p>Seu sistema de agendamento inteligente para barbearias e salões.</p>
        </div>
        <div class="col-md-6">
          <h5>Contato</h5>
          <p>contato@slotify.com | (11) 9999-9999</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 Slotify. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $('#formAgendamento').on('submit', function(e) {
      e.preventDefault();
      alert('Agendamento realizado com sucesso!');
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
