<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendar Horário</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Barbearia Inteligente</a>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Novo Agendamento</h2>
    <form id="formAgendamento" class="mt-3">
      <div class="mb-3">
        <label class="form-label">Serviço</label>
        <select class="form-select" required>
          <option value="">Selecione</option>
          <option value="corte">Corte Masculino</option>
          <option value="barba">Barba</option>
          <option value="combo">Combo Corte + Barba</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Profissional</label>
        <select class="form-select" required>
          <option value="">Selecione</option>
          <option value="joao">João</option>
          <option value="lucas">Lucas</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Data</label>
        <input type="date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Horário sugerido pela IA</label>
        <select class="form-select" required>
          <option>14:00</option>
          <option>15:00</option>
          <option>16:00</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success">Confirmar Agendamento</button>
    </form>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $('#formAgendamento').on('submit', function(e) {
      e.preventDefault();
      alert('Agendamento realizado com sucesso!');
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
