<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">Barbearia Inteligente</a>
      <div>
        <a href="profile.html" class="btn btn-outline-light me-2">Perfil</a>
        <a href="login.html" class="btn btn-outline-light">Sair</a>
      </div>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Bem-vindo, Cliente!</h2>
    <div class="row mt-4">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Próximo Agendamento</h5>
            <p>Data: <strong>10/08/2025</strong></p>
            <p>Horário: <strong>14:00</strong></p>
            <p>Profissional: <strong>João</strong></p>
            <a href="bookings.html" class="btn btn-primary btn-sm">Ver todos</a>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Novo Agendamento</h5>
            <p>Agende seu próximo horário de forma fácil e rápida!</p>
            <a href="booking.html" class="btn btn-success btn-sm">Agendar</a>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Notificações</h5>
            <ul>
              <li>Lembrete: Você tem um agendamento amanhã às 14:00</li>
            </ul>
            <a href="notifications.html" class="btn btn-secondary btn-sm">Ver todas</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
