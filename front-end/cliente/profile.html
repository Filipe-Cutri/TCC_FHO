<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Perfil do Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Barbearia Inteligente</a>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Meu Perfil</h2>
    <form class="mt-3">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" value="Maria da Silva">
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" value="maria@email.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" value="(11) 99999-9999">
      </div>
      <div class="mb-3">
        <label class="form-label">Preferências</label>
        <input type="text" class="form-control" placeholder="Ex: corte, barba, sábado de manhã">
      </div>
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    </form>
    <div class="mt-4">
      <h4>Histórico de Agendamentos</h4>
      <ul class="list-group">
        <li class="list-group-item">05/07/2025 - Corte - João</li>
        <li class="list-group-item">21/06/2025 - Barba - Lucas</li>
      </ul>
    </div>
  </div>
</body>
</html>
