<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler Suggestions Demo - Slotfy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .suggestions {
            margin-top: 30px;
        }

        .suggestion-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .suggestion-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .suggestion-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .suggestion-time {
            font-size: 1.3em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .suggestion-reason {
            color: #666;
            margin-bottom: 8px;
        }

        .suggestion-score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert-info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗓️ Scheduler Suggestions Demo</h1>
            <p>Demonstração do serviço de sugestões de agendamento com AWS Bedrock</p>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <div class="form-section">
                <h2>Parâmetros de Busca</h2>
                
                <div class="row">
                    <div class="form-group">
                        <label for="userId">User ID:</label>
                        <input type="text" id="userId" value="user123" required>
                    </div>
                    <div class="form-group">
                        <label for="timezone">Timezone (IANA):</label>
                        <input type="text" id="timezone" value="America/Sao_Paulo" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="duration">Duração (minutos):</label>
                        <input type="number" id="duration" value="60" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="buffer">Buffer (minutos):</label>
                        <input type="number" id="buffer" value="10" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="maxSuggestions">Máximo de Sugestões:</label>
                    <input type="number" id="maxSuggestions" value="3" min="1" max="10">
                </div>

                <div class="form-group">
                    <label for="preferences">Preferências (opcional):</label>
                    <textarea id="preferences" placeholder="Ex: Prefiro horários pela manhã, entre 9h e 12h">Prefiro horários pela manhã</textarea>
                </div>

                <button class="button" id="getSuggestionsBtn">
                    Buscar Sugestões
                </button>
            </div>

            <div id="loadingDiv" class="loading hidden">
                <span class="spinner"></span>
                Buscando sugestões...
            </div>

            <div id="suggestionsContainer" class="suggestions hidden">
                <h2>Sugestões Disponíveis</h2>
                <div id="suggestionsList"></div>
                <button class="button" id="confirmBtn" disabled>
                    Confirmar Seleção
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.protocol + '//' + window.location.hostname + ':8443/api/scheduler';
        
        let selectedSuggestion = null;

        document.getElementById('getSuggestionsBtn').addEventListener('click', getSuggestions);
        document.getElementById('confirmBtn').addEventListener('click', confirmSelection);

        async function getSuggestions() {
            const userId = document.getElementById('userId').value;
            const timezone = document.getElementById('timezone').value;
            const duration = parseInt(document.getElementById('duration').value);
            const buffer = parseInt(document.getElementById('buffer').value);
            const maxSuggestions = parseInt(document.getElementById('maxSuggestions').value);
            const preferences = document.getElementById('preferences').value;

            if (!userId || !timezone || !duration) {
                showAlert('Por favor, preencha todos os campos obrigatórios', 'error');
                return;
            }

            const requestBody = {
                userId,
                timezone,
                duration,
                buffer,
                maxSuggestions,
                preferences: preferences || null,
                availableWindows: [],
                busySlots: []
            };

            console.log('Request:', requestBody);

            showLoading(true);
            hideAlert();
            hideSuggestions();

            try {
                const response = await fetch(`${API_BASE_URL}/suggest`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                console.log('Response:', data);

                showLoading(false);

                if (!response.ok) {
                    showAlert(data.message || 'Erro ao buscar sugestões', 'error');
                    return;
                }

                if (data.suggestions && data.suggestions.length > 0) {
                    displaySuggestions(data.suggestions);
                } else {
                    showAlert('Nenhuma sugestão disponível para os critérios informados', 'info');
                }
            } catch (error) {
                showLoading(false);
                console.error('Error:', error);
                showAlert('Erro de conexão: ' + error.message, 'error');
            }
        }

        function displaySuggestions(suggestions) {
            const container = document.getElementById('suggestionsContainer');
            const list = document.getElementById('suggestionsList');
            
            list.innerHTML = '';
            selectedSuggestion = null;
            
            suggestions.forEach((suggestion, index) => {
                const card = document.createElement('div');
                card.className = 'suggestion-card';
                card.dataset.index = index;
                
                const startDate = new Date(suggestion.start);
                const endDate = new Date(suggestion.end);
                
                const timeStr = `${formatDateTime(startDate)} - ${formatTime(endDate)}`;
                
                card.innerHTML = `
                    <div class="suggestion-time">${timeStr}</div>
                    <div class="suggestion-reason">${suggestion.reason || 'Horário disponível'}</div>
                    <span class="suggestion-score">Score: ${(suggestion.score * 100).toFixed(0)}%</span>
                `;
                
                card.addEventListener('click', () => selectSuggestion(index, suggestion));
                list.appendChild(card);
            });
            
            container.classList.remove('hidden');
        }

        function selectSuggestion(index, suggestion) {
            selectedSuggestion = suggestion;
            
            document.querySelectorAll('.suggestion-card').forEach((card, i) => {
                if (i === index) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
            
            document.getElementById('confirmBtn').disabled = false;
        }

        async function confirmSelection() {
            if (!selectedSuggestion) {
                showAlert('Por favor, selecione uma sugestão', 'error');
                return;
            }

            const userId = document.getElementById('userId').value;
            
            const requestBody = {
                userId,
                start: selectedSuggestion.start,
                end: selectedSuggestion.end
            };

            console.log('Confirm request:', requestBody);

            try {
                const response = await fetch(`${API_BASE_URL}/confirm`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                console.log('Confirm response:', data);

                if (response.ok && data.success) {
                    showAlert('Agendamento confirmado com sucesso! (Stub - integração real será implementada futuramente)', 'success');
                    hideSuggestions();
                } else {
                    showAlert(data.message || 'Erro ao confirmar agendamento', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Erro de conexão: ' + error.message, 'error');
            }
        }

        function showLoading(show) {
            document.getElementById('loadingDiv').classList.toggle('hidden', !show);
        }

        function hideSuggestions() {
            document.getElementById('suggestionsContainer').classList.add('hidden');
            selectedSuggestion = null;
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type}">
                    ${message}
                </div>
            `;
        }

        function hideAlert() {
            document.getElementById('alertContainer').innerHTML = '';
        }

        function formatDateTime(date) {
            const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            
            return `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()} às ${formatTime(date)}`;
        }

        function formatTime(date) {
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
