<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamentos - Slotify</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">
        <img src="../assets/logo-slotify.png" alt="Slotify Logo">
        Slotify
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a href="dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
          <a href="login.html" class="btn btn-outline-light">Sair</a>
        </div>
      </div>
    </div>
  </nav>
  <div class="main-content">
    <div class="container mt-4">
    <h2>Meus Pagamentos</h2>
    <table class="table mt-3">
      <thead>
        <tr>
          <th>Data</th>
          <th>Serviço</th>
          <th>Valor</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>10/08/2025</td>
          <td>Corte Masculino</td>
          <td>R$ 40,00</td>
          <td><span class="badge bg-success">Pago</span></td>
        </tr>
        <!-- Outros pagamentos -->
      </tbody>
    </table>
    <div class="alert alert-info mt-3">
      <strong>Pagamento via PIX:</strong> Apresente este QR Code na recepção.
    </div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?data=PIX_EXEMPLO" class="img-fluid" alt="QR Code PIX">
  </div>
</body>
</html>
