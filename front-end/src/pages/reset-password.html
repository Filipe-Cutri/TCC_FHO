<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - Slotfy</title>
  <link rel="icon" type="image/png" href="../assets/favicon-slotfy.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/styles/common.css">
  <link rel="stylesheet" href="../assets/styles/welcome.css">
  <link rel="stylesheet" href="../assets/styles/logo-system.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding-top: 80px;
      font-family: 'Inter', sans-serif;
    }
    
    .reset-password-container {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      padding: var(--space-8) 0;
    }
    
    .reset-password-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      overflow: hidden;
      position: relative;
    }
    
    .reset-password-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 50%, #10b981 100%);
    }
    
    .reset-password-card-body {
      padding: 3rem 2.5rem;
    }
    
    .form-floating {
      margin-bottom: 1.5rem;
    }
    
    .form-floating .form-control {
      border: 2px solid var(--color-neutral-200);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(248, 250, 252, 0.8);
    }
    
    .form-floating .form-control:focus {
      border-color: var(--color-primary-400);
      box-shadow: 0 0 0 3px var(--color-primary-100);
      background: var(--color-neutral-0);
    }
    
    .submit-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border: none;
      border-radius: 12px;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      width: 100%;
      transition: all 0.3s ease;
    }
    
    .submit-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.4);
    }
    
    .success-message, .error-message {
      display: none;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .success-message {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #065f46;
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #991b1b;
    }
  </style>
</head>
<body>
  <!-- Modern Header/Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../assets/logo-slotfy.png" alt="Slotfy Logo" class="logo logo-navbar">
        <span class="fw-bold">Slotfy</span>
      </a>
    </div>
  </nav>

  <div class="reset-password-container">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
          <div class="card reset-password-card">
            <div class="card-body reset-password-card-body">
              <div class="text-center mb-5">
                <div style="background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); padding: 20px; border-radius: 20px; display: inline-block; margin-bottom: 20px;">
                  <i class="fas fa-lock" style="color: white; font-size: 2rem;"></i>
                </div>
                <h1 style="font-size: 2rem; font-weight: 700; color: #1f2937; margin-bottom: 0.5rem;">Redefinir Senha</h1>
                <p style="color: #6b7280; font-size: 1rem;">Digite sua nova senha abaixo</p>
              </div>
              
              <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle me-2"></i>
                <strong>Senha alterada com sucesso!</strong><br>
                Você será redirecionado para a página de login.
              </div>
              
              <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="errorText">Erro ao redefinir senha.</span>
              </div>
              
              <form id="resetPasswordForm">
                <div class="form-floating">
                  <input type="email" class="form-control" id="email" placeholder="Seu e-mail" required>
                  <label for="email">📧 E-mail</label>
                </div>
                
                <div class="form-floating">
                  <input type="password" class="form-control" id="newPassword" placeholder="Nova senha" required>
                  <label for="newPassword">🔒 Nova senha</label>
                </div>
                
                <div class="form-floating">
                  <input type="password" class="form-control" id="confirmPassword" placeholder="Confirmar senha" required>
                  <label for="confirmPassword">🔐 Confirmar senha</label>
                </div>
                
                <button type="submit" class="submit-btn">
                  <i class="fas fa-save me-2"></i>
                  Alterar Senha
                </button>
              </form>
              
              <div class="text-center mt-4">
                <a href="../index.html" style="color: #6b7280; text-decoration: none; font-size: 0.875rem;">
                  ← Voltar ao início
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api-config.js"></script>
  <script>
    // Enhanced form handling with backend integration
    document.addEventListener('DOMContentLoaded', function() {
      const resetForm = document.getElementById('resetPasswordForm');
      const submitBtn = document.querySelector('.submit-btn');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      
      // Get token from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const userType = urlParams.get('type') || 'client'; // Default to client if not specified
      
      if (!token) {
        errorText.textContent = 'Token de redefinição não encontrado. Solicite um novo link.';
        errorMessage.style.display = 'block';
        resetForm.style.display = 'none';
        return;
      }
      
      resetForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const newPassword = document.getElementById('newPassword').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        
        // Validate inputs
        if (!email || !newPassword || !confirmPassword) {
          errorText.textContent = 'Por favor, preencha todos os campos.';
          errorMessage.style.display = 'block';
          return;
        }
        
        if (newPassword !== confirmPassword) {
          errorText.textContent = 'As senhas não coincidem.';
          errorMessage.style.display = 'block';
          return;
        }
        
        if (newPassword.length < 6) {
          errorText.textContent = 'A senha deve ter pelo menos 6 caracteres.';
          errorMessage.style.display = 'block';
          return;
        }
        
        // Hide previous messages
        successMessage.style.display = 'none';
        errorMessage.style.display = 'none';
        
        // Add loading state
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Alterando...';
        submitBtn.disabled = true;
        
        try {
          // Determine the correct API endpoint based on user type
          const apiEndpoint = userType === 'establishment' 
            ? API_CONFIG.endpoints.establishment.resetPassword 
            : API_CONFIG.endpoints.client.resetPassword;
          
          // Call reset password API
          const response = await window.apiClient.post(apiEndpoint, {
            email: email,
            token: token,
            newPassword: newPassword
          });
          
          if (response.success) {
            // Show success message
            successMessage.style.display = 'block';
            resetForm.style.display = 'none';
            
            // Redirect after 3 seconds
            setTimeout(() => {
              // Redirect to appropriate login page based on user type
              if (userType === 'establishment') {
                window.location.href = '../pages/establishment/establishment-login.html';
              } else {
                window.location.href = '../pages/client/client-login.html';
              }
            }, 3000);
          } else {
            throw new Error(response.message || 'Erro ao redefinir senha');
          }
        } catch (error) {
          console.error('Reset password error:', error);
          
          // Show error message
          errorText.textContent = error.message || 'Erro ao redefinir senha. O token pode ter expirado.';
          errorMessage.style.display = 'block';
          
          // Reset button state
          submitBtn.innerHTML = '<i class="fas fa-save me-2"></i>Alterar Senha';
          submitBtn.disabled = false;
        }
      });
      
      // Enhanced input focus effects
      const formInputs = document.querySelectorAll('.form-control');
      formInputs.forEach(input => {
        input.addEventListener('focus', function() {
          this.parentElement.style.transform = 'scale(1.02)';
          this.parentElement.style.transition = 'all 0.3s ease';
        });
        
        input.addEventListener('blur', function() {
          this.parentElement.style.transform = 'scale(1)';
        });
      });
    });
  </script>
</body>
</html>
