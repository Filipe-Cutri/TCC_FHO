    .login-container {
      min-height: calc(100vh - 80px);

    .login-card {
      background: var(--color-neutral-0);

      box-shadow: var(--shadow-2xl) !important;
      border: 1px solid var(--color-neutral-100) !important;
      overflow: hidden;
      position: relative;
    }
    
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: var(--gradient-success);
    }
    
    .login-card-body {
      padding: var(--space-12) var(--space-10);

    .login-title {
      font-family: var(--font-family-display);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-neutral-800);
      margin-bottom: var(--space-2);
    }
    
    .login-subtitle {
      color: var(--color-neutral-600);
      font-size: var(--font-size-base);
      margin-bottom: var(--space-10);
    }
    
    .form-floating {
      margin-bottom: var(--space-6);
    }
    
    .form-floating .form-control {
      border: 2px solid var(--color-neutral-200);
      border-radius: var(--radius-lg);
      padding: var(--space-6) var(--space-4) var(--space-3);
      font-size: var(--font-size-base);
      transition: var(--transition-fast);
      background: var(--color-neutral-50);
    }
    
    .form-floating .form-control:focus {
      border-color: var(--color-success-400);
      box-shadow: 0 0 0 3px var(--color-success-100);
      background: var(--color-neutral-0);
    }
    
    .form-floating label {
      color: var(--color-neutral-500);
      font-weight: var(--font-weight-medium);
      padding: var(--space-6) var(--space-4) var(--space-3);
      z-index: 1;
    }
    
    .form-floating .form-control:focus ~ label,
    .form-floating .form-control:not(:placeholder-shown) ~ label {
      transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
      z-index: 2;
    }
    
    .login-actions {
      margin-top: var(--space-8);
    }
    
    .login-links {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      margin-top: var(--space-6);
    }
    
    .login-links a {
      text-decoration: none;
      color: var(--color-success-600);
      font-weight: var(--font-weight-medium);
      transition: var(--transition-fast);
      text-align: center;
      padding: var(--space-2);
      border-radius: var(--radius-base);
    }
    
    .login-links a:hover {
      color: var(--color-success-700);
      background: var(--color-success-50);
    }
    
    .back-link {
      color: var(--color-neutral-500) !important;
      font-size: var(--font-size-sm);
    }
    
    .back-link:hover {
      color: var(--color-neutral-700) !important;
      background: var(--color-neutral-100) !important;
    }

  <script>
    // Enhanced form handling with modern UX
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      
      // Add loading state
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Carregando...';
      submitBtn.disabled = true;
      
      // Simulate API call
      setTimeout(() => {
        // Reset button
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
        
        // Redirect to dashboard
        window.location.href = 'dashboard-estab.html';
      }, 1500);
    });
    
    // Enhanced form interactions
    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.classList.add('focused');
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.classList.remove('focused');
      });
      
      // Real-time validation feedback
      input.addEventListener('input', function() {
        if (this.value.length > 0) {
          this.classList.remove('is-invalid');
          this.classList.add('is-valid');
        }
      });
    });
    
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
    
    // Add subtle animation on page load
    window.addEventListener('load', function() {
      const loginCard = document.querySelector('.login-card');
      loginCard.style.opacity = '0';
      loginCard.style.transform = 'translateY(20px)';
      
      setTimeout(() => {
        loginCard.style.transition = 'all 0.6s ease';
        loginCard.style.opacity = '1';
        loginCard.style.transform = 'translateY(0)';
      }, 100);
    });

    // Navbar scroll effects
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
        navbar.style.backdropFilter = 'blur(20px)';
      } else {
        navbar.style.backgroundColor = 'var(--color-neutral-0)';
        navbar.style.backdropFilter = 'blur(20px)';
      }
    });
  </script>
