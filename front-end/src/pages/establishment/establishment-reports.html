<body class="establishment-page">

      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="establishment-dashboard.html">
              <i class="fas fa-tachometer-alt me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-appointments.html">
              <i class="fas fa-calendar me-1"></i>Agendamentos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-professionals.html">
              <i class="fas fa-users me-1"></i>Profissionais
            </a>
          </li>
          <li class="nav-item">

          <li class="nav-item">

        <div class="navbar-nav">
          <a href="establishment-admin.html" class="btn btn-outline-light me-2">

          </a>

    </div>
  </nav>
  
  <div class="establishment-main-content">
    <div class="establishment-container">
      <!-- Page Header -->
      <div class="establishment-page-header">
        <h1>
          <span class="page-icon">
            <i class="fas fa-chart-bar"></i>
          </span>
          Relatórios e Analytics
        </h1>
        <p class="establishment-page-subtitle">Acompanhe o desempenho e analise dados do seu estabelecimento</p>
      </div>

      <!-- Quick Stats Cards - Removed as per requirement to remove mocked content -->
      
      <!-- Report Filters - Removed as per requirement to remove mocked content -->
      
      <!-- Reports content - Removed mocked content as per requirement -->
      <div class="row">
        <div class="col-12">
          <div class="establishment-card">
            <div class="card-body text-center py-5">
              <i class="fas fa-chart-bar fa-3x text-muted mb-3"></i>
              <h5 class="text-muted">Relatórios em Desenvolvimento</h5>
              <p class="text-muted">Os relatórios serão exibidos aqui quando conectados ao backend.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/establishment-session.js"></script>
  <script>
    // Admin page access control
    document.addEventListener('DOMContentLoaded', function() {
      // Require admin access for this page
      if (!window.establishmentSession.requireAdmin()) {
        return; // User will be redirected
      }
    });
    
    // Navbar scroll effects
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.establishment-navbar');
      if (window.scrollY > 50) {
        navbar.style.backgroundColor = 'rgba(2, 132, 199, 0.95)';
        navbar.style.backdropFilter = 'blur(20px)';
      } else {
        navbar.style.backgroundColor = 'linear-gradient(135deg, var(--color-secondary-600) 0%, var(--color-secondary-700) 100%)';
        navbar.style.backdropFilter = 'blur(20px)';
      }
    });

    // Card hover effects
    document.querySelectorAll('.establishment-card').forEach(card => {
      card.addEventListener('mouseenter', function() {
        this.style.transform = 'translateY(-4px)';
      });
      
      card.addEventListener('mouseleave', function() {
        this.style.transform = 'translateY(0)';
      });
    });

    // Report filter buttons
    document.querySelectorAll('.btn-group .establishment-btn').forEach(button => {
      button.addEventListener('click', function() {
        // Remove active class from all buttons in the same group
        const group = this.closest('.btn-group');
        group.querySelectorAll('.establishment-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        // Add active class to clicked button
        this.classList.add('active');
      });
    });
    
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>
</body>
