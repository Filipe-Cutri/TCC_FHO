<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração - Slotify - Slotify</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard-estab.html">
        <img src="../assets/logo-slotify.png" alt="Slotify Logo">
        Slotify
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a href="dashboard-estab.html" class="btn btn-outline-light me-2">Dashboard</a>
          <a href="login-estab.html" class="btn btn-outline-light">Sair</a>
        </div>
      </div>
    </div>
  </nav>
  <div class="main-content">
    <div class="container mt-4">
    <h2>Administração</h2>
    <div class="row mt-3">
      <div class="col-md-6">
        <h4>Profissionais</h4>
        <a href="profissionais-estab.html" class="btn btn-outline-primary mb-3">Gerenciar Profissionais</a>
        <h4>Serviços</h4>
        <a href="servicos-estab.html" class="btn btn-outline-primary mb-3">Gerenciar Serviços</a>
      </div>
      <div class="col-md-6">
        <h4>Horários de Funcionamento</h4>
        <form>
          <div class="mb-3">
            <label class="form-label">Dias de funcionamento</label>
            <input type="text" class="form-control" value="Seg a Sáb">
          </div>
          <div class="mb-3">
            <label class="form-label">Horário de abertura</label>
            <input type="time" class="form-control" value="09:00">
          </div>
          <div class="mb-3">
            <label class="form-label">Horário de fechamento</label>
            <input type="time" class="form-control" value="19:00">
          </div>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
