  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>
<body class="establishment-page">
  <nav class="navbar navbar-expand-lg navbar-dark establishment-navbar fixed-top">

        <img src="../../assets/logo-slotify.png" alt="Slotify Logo">
        Slotify
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="establishment-dashboard.html">
              <i class="fas fa-tachometer-alt me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-appointments.html">
              <i class="fas fa-calendar me-1"></i>Agendamentos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-professionals.html">
              <i class="fas fa-users me-1"></i>Profissionais
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-services.html">
              <i class="fas fa-cut me-1"></i>Serviços
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-reports.html">
              <i class="fas fa-chart-bar me-1"></i>Relatórios
            </a>
          </li>
        </ul>
        <div class="navbar-nav">
          <a href="establishment-notifications.html" class="nav-link position-relative me-2">
            <i class="fas fa-bell"></i>
            <span class="establishment-notification-badge">2</span>

          <a href="establishment-admin.html" class="btn btn-outline-light me-2">

      </div>
    </div>
  </nav>
  <div class="main-content">
    <div class="container mt-4">
    <h2>Notificações</h2>
    <ul class="list-group mt-3">
      <li class="list-group-item">Novo agendamento confirmado para Maria da Silva, 14:00.</li>
      <li class="list-group-item">Cliente João cancelou o agendamento das 15:00.</li>
      <!-- Outras notificações -->
    </ul>
  </div>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Navbar scroll effects
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
        navbar.style.backdropFilter = 'blur(20px)';
      } else {
        navbar.style.backgroundColor = 'var(--color-neutral-0)';
        navbar.style.backdropFilter = 'blur(20px)';
      }
    });
    
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>
</body>
