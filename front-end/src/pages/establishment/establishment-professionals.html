<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profissionais - Slotfy</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/styles/common.css">
  <link rel="stylesheet" href="../../assets/styles/logo-system.css">
  <link rel="stylesheet" href="../../assets/styles/establishment-styles.css">
</head>
<body class="establishment-page">
  <nav class="navbar navbar-expand-lg navbar-dark establishment-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand" href="establishment-dashboard.html">
        <img src="../../assets/logo-slotfy.png" alt="Slotfy Logo" class="logo logo-navbar">
        Slotfy
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="establishment-dashboard.html">
              <i class="fas fa-tachometer-alt me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-appointments.html">
              <i class="fas fa-calendar me-1"></i>Agendamentos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="establishment-professionals.html">
              <i class="fas fa-users me-1"></i>Profissionais
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-services.html">
              <i class="fas fa-cut me-1"></i>Serviços
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-reports.html">
              <i class="fas fa-chart-bar me-1"></i>Relatórios
            </a>
          </li>
        </ul>
        <div class="navbar-nav">
          <a href="establishment-notifications.html" class="nav-link position-relative me-2">
            <i class="fas fa-bell"></i>
            <span class="establishment-notification-badge">2</span>
          </a>
          <a href="establishment-admin.html" class="btn btn-outline-light me-2">
            <i class="fas fa-cog me-1"></i>Administração
          </a>
          <a href="establishment-login.html" class="btn btn-outline-light">
            <i class="fas fa-sign-out-alt me-1"></i>Sair
          </a>
        </div>
      </div>
    </div>
  </nav>
  
  <div class="establishment-main-content">
    <div class="establishment-container">
      <!-- Page Header -->
      <div class="establishment-page-header">
        <h1>
          <span class="page-icon">
            <i class="fas fa-users"></i>
          </span>
          Gestão de Profissionais
        </h1>
        <p class="establishment-page-subtitle">Gerencie a equipe de profissionais do seu estabelecimento</p>
      </div>

      <!-- Action Buttons -->
      <div class="row mb-4">
        <div class="col-md-6">
          <a href="#" class="establishment-btn establishment-btn-success" data-bs-toggle="modal" data-bs-target="#newProfessionalModal">
            <i class="fas fa-plus me-2"></i>
            Novo Profissional
          </a>
        </div>
        <div class="col-md-6 text-md-end">
          <!-- Filtrar and Exportar buttons removed as per requirement -->
        </div>
      </div>

      <!-- Professionals Grid -->
      <div class="row" id="professionalsGrid">
        <!-- Professionals will be loaded from backend -->
        <div class="col-12">
          <div class="establishment-card">
            <div class="card-body text-center py-5">
              <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
              <p class="mt-2 text-muted">Carregando profissionais...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Professional Modal -->
    <div class="modal fade" id="newProfessionalModal" tabindex="-1" aria-labelledby="newProfessionalModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newProfessionalModalLabel">
              <span class="card-icon me-2">
                <i class="fas fa-user-plus"></i>
              </span>
              Adicionar Novo Profissional
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="establishment-form-group">
                <label class="establishment-form-label">Nome Completo</label>
                <input type="text" id="professionalName" class="establishment-form-control" placeholder="Ex: João Pedro Silva" required>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="establishment-form-group">
                    <label class="establishment-form-label">Email</label>
                    <input type="email" id="professionalEmail" class="establishment-form-control" placeholder="joao@exemplo.com">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="establishment-form-group">
                    <label class="establishment-form-label">Telefone</label>
                    <input type="tel" id="professionalPhone" class="establishment-form-control" placeholder="(11) 99999-9999">
                  </div>
                </div>
              </div>
              <div class="establishment-form-group">
                <label class="establishment-form-label">Especialidades</label>
                <textarea id="professionalSpecialties" class="establishment-form-control" rows="2" placeholder="Ex: Cortes masculinos, Barba, etc."></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="establishment-btn establishment-btn-secondary" data-bs-dismiss="modal">
              <i class="fas fa-times me-2"></i>Cancelar
            </button>
            <button type="button" class="establishment-btn establishment-btn-success">
              <i class="fas fa-save me-2"></i>Salvar Profissional
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api-config.js"></script>
  <script src="../../assets/js/establishment-session.js"></script>
  <script src="../../assets/js/establishment-professionals.js"></script>
  <script>
    // Navbar scroll effects
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.establishment-navbar');
      if (window.scrollY > 50) {
        navbar.style.backgroundColor = 'rgba(2, 132, 199, 0.95)';
        navbar.style.backdropFilter = 'blur(20px)';
      } else {
        navbar.style.backgroundColor = 'linear-gradient(135deg, var(--color-secondary-600) 0%, var(--color-secondary-700) 100%)';
        navbar.style.backdropFilter = 'blur(20px)';
      }
    });

    // Card hover effects
    document.querySelectorAll('.establishment-card').forEach(card => {
      card.addEventListener('mouseenter', function() {
        this.style.transform = 'translateY(-4px)';
      });
      
      card.addEventListener('mouseleave', function() {
        this.style.transform = 'translateY(0)';
      });
    });
    
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>
</body>
</html>
