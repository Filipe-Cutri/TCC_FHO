name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend to Railway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Railway
        working-directory: back-end
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link 8d043692-e0d2-4547-bf90-411ad0dd0279
          railway up --service "TCC_FHO: Back-end" --detach

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Railway
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to Railway
        working-directory: front-end
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link 8d043692-e0d2-4547-bf90-411ad0dd0279
          railway up --service "TCC_FHO: front-end" --detach