name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend to Railway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Railway
        working-directory: back-end
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Try with explicit service name first (current format)
          railway up --service "TCC_FHO: Back-end" --ci || \
          # Try with lowercase and hyphens
          railway up --service "tcc-fho-back-end" --ci || \
          # Try simplified name
          railway up --service "backend" --ci || \
          # Try without service specification (Railway auto-detects based on root directory)
          railway up --ci
  
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Railway
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to Railway
        working-directory: front-end
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Try with explicit service name first (current format)
          railway up --service "TCC_FHO: Front-end" --ci || \
          # Try with lowercase and hyphens
          railway up --service "tcc-fho-front-end" --ci || \
          # Try simplified name
          railway up --service "frontend" --ci || \
          # Try without service specification (Railway auto-detects based on root directory)
          railway up --ci