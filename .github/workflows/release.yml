name: Release

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  # Draft PR validation
  draft-pr-check:
    name: Draft PR Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Draft PR validation
        run: |
          echo "✓ Draft PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Draft PRs validated with basic checks only"

  # Ready PR build and test
  ready-pr-check:
    name: Ready PR Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.pull_request.merged != true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Build and test
        run: |
          cd back-end
          chmod +x gradlew
          ./gradlew build --no-daemon

  # Create release on merge to main
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get latest tag and bump version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Creating release $NEW_TAG"
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          body: |
            ## Release ${{ steps.version.outputs.new_tag }}
            
            **PR**: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            **Author**: @${{ github.event.pull_request.user.login }}
          draft: false
          prerelease: false
