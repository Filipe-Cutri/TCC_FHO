# ==========================================
# application-prod.properties
# Configura��es para PRODU��O (Railway)
# ==========================================

# Database Configuration - Railway PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configura��es de conex�o do pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server Configuration
server.port=${PORT:8080}
server.ssl.enabled=false
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Forward Headers Strategy - Essential for Railway proxy
# Railway terminates TLS and forwards requests as HTTP with X-Forwarded-* headers
# This tells Spring to trust and process those headers to avoid redirect loops
server.forward-headers-strategy=native

# JPA/Hibernate em Produ��o
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging em Produ��o
logging.level.root=INFO
logging.level.com.slotfy=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# File Upload
file.upload-dir=/tmp/uploads

# Tratamento de erros
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo