# ==========================================
# application-prod.properties
# Configurações para PRODUÇÃO (Railway)
# ==========================================

# Database Configuration - Railway PostgreSQL
# IMPORTANTE: Railway injeta DATABASE_URL automaticamente
# Formato: postgresql://usuario:senha@host:porta/database
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de conexão do pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# SSL/TLS do PostgreSQL (Railway usa SSL)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# Server Configuration
server.ssl.enabled=false
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# JPA/Hibernate em Produção
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging em Produção - Reduzido para performance
logging.level.root=INFO
logging.level.com.slotfy=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# File Upload - Railway usa sistema efêmero
file.upload-dir=/tmp/uploads

# Tratamento de erros
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo