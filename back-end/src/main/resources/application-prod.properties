# Production Profile Configuration for Railway Deployment

# Database Configuration - Railway provides DATABASE_URL
# Railway PostgreSQL format: postgresql://user:password@host:port/database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Production Logging - Less verbose
logging.level.com.slotify=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# SSL Configuration - Disabled in production (Railway handles HTTPS)
server.ssl.enabled=false
server.port=${PORT:8080}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads}

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@slotfy.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Slotfy - Sistema de Agendamento}
