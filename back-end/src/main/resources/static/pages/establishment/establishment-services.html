<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços - Slotfy</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/styles/common.css">
  <link rel="stylesheet" href="../../assets/styles/logo-system.css">
  <link rel="stylesheet" href="../../assets/styles/establishment-styles.css">
</head>
<body class="establishment-page">
  <nav class="navbar navbar-expand-lg navbar-dark establishment-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand" href="establishment-dashboard.html">
        <img src="../../assets/logo-slotfy.png" alt="Slotfy Logo" class="logo logo-navbar">
        Slotfy
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="establishment-dashboard.html">
              <i class="fas fa-tachometer-alt me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-appointments.html">
              <i class="fas fa-calendar me-1"></i>Agendamentos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-professionals.html">
              <i class="fas fa-users me-1"></i>Profissionais
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="establishment-services.html">
              <i class="fas fa-cut me-1"></i>Serviços
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="establishment-reports.html">
              <i class="fas fa-chart-bar me-1"></i>Relatórios
            </a>
          </li>
        </ul>
        <div class="navbar-nav">
          <a href="establishment-admin.html" class="btn btn-outline-light me-2">
            <i class="fas fa-cog me-1"></i>Administração
          </a>
          <a href="establishment-login.html" class="btn btn-outline-light">
            <i class="fas fa-sign-out-alt me-1"></i>Sair
          </a>
        </div>
      </div>
    </div>
  </nav>
  
  <div class="establishment-main-content">
    <div class="establishment-container">
      <!-- Page Header -->
      <div class="establishment-page-header">
        <h1>
          <span class="page-icon">
            <i class="fas fa-cut"></i>
          </span>
          Gestão de Serviços
        </h1>
        <p class="establishment-page-subtitle">Configure os serviços oferecidos pelo seu estabelecimento</p>
      </div>

      <!-- Action Buttons -->
      <div class="row mb-4">
        <div class="col-md-6">
          <a href="#" class="establishment-btn establishment-btn-success" data-bs-toggle="modal" data-bs-target="#newServiceModal">
            <i class="fas fa-plus me-2"></i>
            Novo Serviço
          </a>
        </div>
        <div class="col-md-6 text-md-end">
          <!-- Filtrar and Exportar buttons removed as per requirement -->
        </div>
      </div>

      <!-- Services Table -->
      <div class="establishment-card">
        <div class="card-body">
          <h5 class="card-title">
            <span class="card-icon">
              <i class="fas fa-list"></i>
            </span>
            Serviços Cadastrados
          </h5>
          <div class="table-responsive">
            <table class="establishment-table table">
              <thead>
                <tr>
                  <th>Serviço</th>
                  <th>Duração</th>
                  <th>Valor</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="servicesTableBody">
                <!-- Services will be loaded from backend -->
                <tr>
                  <td colspan="5" class="text-center py-4">
                    <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
                    <p class="mt-2 text-muted">Carregando serviços...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Service Statistics - Removed as per requirement to remove mocked content -->
    </div>

    <!-- Add Service Modal -->
    <div class="modal fade" id="newServiceModal" tabindex="-1" aria-labelledby="newServiceModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newServiceModalLabel">
              <span class="card-icon me-2">
                <i class="fas fa-plus"></i>
              </span>
              Adicionar Novo Serviço
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="establishment-form-group">
                <label class="establishment-form-label">Nome do Serviço</label>
                <input type="text" id="serviceName" class="establishment-form-control" placeholder="Ex: Corte Masculino" required>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="establishment-form-group">
                    <label class="establishment-form-label">Duração (minutos)</label>
                    <input type="number" id="serviceDuration" class="establishment-form-control" placeholder="Ex: 30" min="1" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="establishment-form-group">
                    <label class="establishment-form-label">Valor (R$)</label>
                    <input type="number" id="servicePrice" class="establishment-form-control" placeholder="Ex: 40.00" step="0.01" min="0" required>
                  </div>
                </div>
              </div>
              <div class="establishment-form-group">
                <label class="establishment-form-label">Descrição</label>
                <textarea id="serviceDescription" class="establishment-form-control" rows="3" placeholder="Descreva o serviço oferecido"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="establishment-btn establishment-btn-secondary" data-bs-dismiss="modal">
              <i class="fas fa-times me-2"></i>Cancelar
            </button>
            <button type="button" class="establishment-btn establishment-btn-success">
              <i class="fas fa-save me-2"></i>Salvar Serviço
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api-config.js"></script>
  <script src="../../assets/js/establishment-session.js"></script>
  <script src="../../assets/js/establishment-services.js"></script>
  <script>
    // Navbar scroll effects
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.establishment-navbar');
      if (window.scrollY > 50) {
        navbar.style.backgroundColor = 'rgba(2, 132, 199, 0.95)';
        navbar.style.backdropFilter = 'blur(20px)';
      } else {
        navbar.style.backgroundColor = 'linear-gradient(135deg, var(--color-secondary-600) 0%, var(--color-secondary-700) 100%)';
        navbar.style.backdropFilter = 'blur(20px)';
      }
    });

    // Card hover effects
    document.querySelectorAll('.establishment-card').forEach(card => {
      card.addEventListener('mouseenter', function() {
        this.style.transform = 'translateY(-4px)';
      });
      
      card.addEventListener('mouseleave', function() {
        this.style.transform = 'translateY(0)';
      });
    });
    
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>
</body>
</html>
