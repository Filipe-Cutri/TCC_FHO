<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Basic Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  
  <!-- SEO Meta Tags -->
  <title>Login do Estabelecimento - Slotfy</title>
  <meta name="description" content="Acesse o painel do seu estabelecimento no Slotfy para gerenciar agendamentos, serviços e clientes de forma inteligente.">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../assets/favicon-slotfy.png">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Stylesheets -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/styles/common.css">
  <link rel="stylesheet" href="../../assets/styles/logo-system.css">
  <link rel="stylesheet" href="../../assets/styles/auth-styles.css">
  <link rel="stylesheet" href="../../assets/styles/auth-improvements.css">
  <link rel="stylesheet" href="../../assets/styles/utilities.css">
</head>
<body class="auth-page establishment-auth">
  <!-- Unified Navigation -->
  <nav class="navbar navbar-expand-lg auth-navbar">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">
        <img src="../../assets/logo-slotfy.png" alt="Slotfy Logo" class="logo-nav me-2">
        <div class="brand-text">
          <div class="brand-name">Slotfy</div>
          <div class="brand-tagline">Sistema de Agendamento</div>
        </div>
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="../../index.html#recursos">Recursos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../../index.html#precos">Planos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../../index.html#contato">Contato</a>
          </li>
        </ul>
        
        <div class="navbar-nav">
          <a class="nav-btn nav-btn-client" href="../client/client-login.html">
            <i class="fas fa-user me-2"></i>
            Login Cliente
          </a>
          <a class="nav-btn nav-btn-establishment" href="establishment-register.html">
            <i class="fas fa-store me-2"></i>
            Cadastro Estabelecimento
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="auth-container">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="auth-card establishment-card">
            <div class="auth-body">
              <div class="text-center mb-4">
                <h2 class="auth-title">Login Estabelecimento</h2>
                <p class="auth-subtitle">Gerencie seu negócio de forma inteligente</p>
              </div>
              
              <form id="establishmentLoginForm">
                <div class="form-floating-custom">
                  <input type="email" class="form-control" id="email" placeholder=" " required>
                  <label for="email">📧 E-mail</label>
                </div>
                
                <div class="form-floating-custom">
                  <input type="password" class="form-control" id="password" placeholder=" " required>
                  <label for="password">🔐 Senha</label>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">
                      Lembrar-me
                    </label>
                  </div>
                  <a href="establishment-forgot-password.html" class="auth-link">
                    Esqueci minha senha
                  </a>
                </div>
                
                <button type="submit" class="btn-auth btn-auth-primary mb-3">
                  <i class="fas fa-sign-in-alt me-2"></i>
                  Entrar
                </button>
                
                <div class="text-center">
                  <p class="auth-subtitle mb-2">Ainda não tem uma conta?</p>
                  <a href="establishment-register.html" class="auth-link">
                    <i class="fas fa-store me-2"></i>
                    Criar Conta de Estabelecimento
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api-config.js"></script>
  <script src="../../assets/js/establishment-session.js"></script>
  
  <script>
    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', function() {
      if (window.establishmentSession && window.establishmentSession.isLoggedIn()) {
        window.location.href = 'establishment-dashboard.html';
        return;
      }
    });

    document.getElementById('establishmentLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        // Show loading state
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Entrando...';
        submitBtn.disabled = true;
        
        // Make API call
        const response = await apiClient.post(API_CONFIG.endpoints.establishment.login, {
          email,
          password
        });
        
        if (response.success) {
          // Store session data using the session manager
          window.establishmentSession.setSession(response.user);
          
          // Redirect to dashboard
          window.location.href = 'establishment-dashboard.html';
        } else {
          throw new Error(response.message || 'Erro no login');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Erro no login: ' + error.message);
        
        // Reset button
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Entrar';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
