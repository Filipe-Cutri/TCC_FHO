# ==========================================
# application.properties (BASE)
# Configura��es compartilhadas entre todos os ambientes
# ==========================================

# Application Configuration
spring.application.name=slotify-backend

# Version Information (injected during build/deployment)
app.version=${APP_VERSION:0.0.1-SNAPSHOT}
app.commit.hash=${COMMIT_HASH:unknown}

# JPA/Hibernate Configuration (comum para todos os ambientes)
# Note: database-platform is defined in each profile (dev, prod, test)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gmail SMTP Email Configuration
# Note: For production, use environment variables instead of hardcoded credentials
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:filipe.cutri18@gmail.com.br}
spring.mail.password=${GMAIL_PASSWORD:sanbeohgweevaljp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender information
email.from.address=${EMAIL_FROM_ADDRESS:filipe.cutri18@gmail.com.br}
email.from.name=Slotfy - Sistema de Agendamento

# Frontend URL for password reset links
frontend.url=${FRONTEND_URL:http://localhost:3000}

# AWS Bedrock Configuration
aws.region=${AWS_REGION:us-east-1}
bedrock.model.id=${BEDROCK_MODEL_ID:meta.llama3-70b-instruct-v1:0}
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}

# Profile ativo (usa vari�vel de ambiente ou dev como padr�o)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}