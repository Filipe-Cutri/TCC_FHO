# ==========================================
# application.properties (BASE)
# Configura��es compartilhadas entre todos os ambientes
# ==========================================

# Application Configuration
spring.application.name=slotify-backend

# JPA/Hibernate Configuration (comum para todos os ambientes)
# Note: database-platform is defined in each profile (dev, prod, test)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM:noreply@slotfy.com}
sendgrid.from.name=Slotfy - Sistema de Agendamento

# Frontend URL for password reset links
frontend.url=${FRONTEND_URL:http://localhost:3000}

# AWS Bedrock Configuration
aws.region=${AWS_REGION:us-east-1}
bedrock.model.id=${BEDROCK_MODEL_ID:meta.llama3-70b-instruct-v1:0}
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}

# Profile ativo (usa vari�vel de ambiente ou dev como padr�o)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}