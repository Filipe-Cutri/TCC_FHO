# Application Configuration
spring.application.name=slotify-backend

# Server Configuration - Railway injeta PORT automaticamente
server.port=${PORT:8080}

# SSL Configuration - Desabilitado por padrão (Railway gerencia HTTPS)
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:classpath:slotfy.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:slotfypass}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=slotfy

# Database Configuration - Usa DATABASE_URL do Railway quando disponível
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/slotify}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads}

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=noreply@slotfy.com
sendgrid.from.name=Slotfy - Sistema de Agendamento

# Profile - Usa variável de ambiente ou 'dev' como padrão
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}