# Application Configuration
spring.application.name=slotify-backend

# Version Information (injected during build/deployment)
app.version=${APP_VERSION:0.0.1-SNAPSHOT}
app.commit.hash=${COMMIT_HASH:unknown}

# JPA/Hibernate Configuration (comum para todos os ambientes)
# Note: database-platform is defined in each profile (dev, prod, test)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gmail SMTP Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=465
