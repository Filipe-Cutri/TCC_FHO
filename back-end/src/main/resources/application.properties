# ==========================================
# application.properties (BASE)
# Configurações compartilhadas entre todos os ambientes
# ==========================================

# Application Configuration
spring.application.name=slotify-backend

# JPA/Hibernate Configuration (comum para todos os ambientes)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=noreply@slotfy.com
sendgrid.from.name=Slotfy - Sistema de Agendamento

# Profile ativo (usa variável de ambiente ou dev como padrão)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}