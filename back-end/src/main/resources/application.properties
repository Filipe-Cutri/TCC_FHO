# Application Configuration
spring.application.name=slotify-backend
server.port=8443

# SSL Configuration
server.ssl.enabled=true
server.ssl.key-store=classpath:slotfy.p12
server.ssl.key-store-password=slotfypass
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=slotfy

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/slotify
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# Profile-specific configurations
spring.profiles.active=dev