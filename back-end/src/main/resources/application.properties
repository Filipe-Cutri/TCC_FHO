# Application Configuration
spring.application.name=slotify-backend

# Active Profile - Uses environment variable or defaults to 'dev'
# For Railway deployment, set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration - Railway injects PORT automatically
server.port=${PORT:8080}

# SSL Configuration - Disabled by default (Railway manages HTTPS)
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:classpath:slotfy.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:slotfypass}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=slotfy

# Database Configuration - Uses DATABASE_URL from Railway when available
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/slotify}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging Configuration
logging.level.org.hibernate.SQL=${LOGGING_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_HIBERNATE_BINDER:TRACE}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}
file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads}

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@slotfy.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Slotfy - Sistema de Agendamento}
