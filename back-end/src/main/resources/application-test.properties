# Test Profile Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Disable Flyway for tests (using ddl-auto=create-drop instead)
spring.flyway.enabled=false

# Test specific logging
logging.level.com.slotify=DEBUG
logging.level.org.springframework.web=DEBUG

# SSL Configuration for Testing
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:slotfy.p12
server.ssl.key-store-password=slotfypass
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=slotfy