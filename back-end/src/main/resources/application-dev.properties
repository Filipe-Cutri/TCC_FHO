# Development Profile Configuration - Using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console for development (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development specific logging
logging.level.com.slotify=DEBUG
logging.level.org.springframework.web=DEBUG

# SSL Configuration for Development
server.port=${DEV_PORT:8443}
server.ssl.enabled=${DEV_SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:classpath:slotfy.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:slotfypass}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=slotfy

# SendGrid Configuration for Development (optional for testing)
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:noreply@slotfy.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:Slotfy - Sistema de Agendamento}
